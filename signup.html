<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Sunday Funday Gear</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our Storefront CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1 style="letter-spacing: 4px;">SUNDAY FUNDAY GEAR</h1>
        <p class="welcome-text">Football • Friends • Sundays</p>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="#">Jerseys</a>
        <a href="#">T-Shirts</a>
        <a href="#">Hats</a>
        <a href="signup.html">Sign Up</a>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Create Your Account
                        </h2>

                        <form>

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       placeholder="Enter your username"
                                       required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       placeholder="Enter your email"
                                       required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       placeholder="Enter your password"
                                       required>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       placeholder="Confirm your password"
                                       required>
                            </div>

                            <!-- Sign Up Button -->
                            <div class="d-grid">
                                <button type="submit">
                                    Sign Up
                                </button>
                            </div>

                        </form>

                        <p class="text-center mt-3">
                            <a href="index.html">Back to Storefront</a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Sunday Funday Gear | Football • Friends • Sundays</p>
    </footer>

</body>
</html>
